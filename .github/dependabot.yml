# Mises à jour automatiques des dépendances : une demande de fusion par semaine au maximum.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      polices:
        patterns: ["@fontsource*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
